# A pushed v* tag builds the release archives (make release-dist) and publishes
# them as a GitHub release with notes generated from the commits since the
# previous tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # go.work is gitignored, so the build uses the module versions in go.mod.
      - run: make release-dist VERSION=${{ github.ref_name }}
      - run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
