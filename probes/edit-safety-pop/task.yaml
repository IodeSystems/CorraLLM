name: edit-safety-pop
class: coding
description: |
  ## What this measures

  The cheapest rung of the edit-safety ladder: does a single bad edit LAND on
  disk, and does the toolset catch it?

  The task is one method — implement `Pop` on `IntStack`, returning the top
  element with `ok=true` or `0, false` when empty. One node, one edit, no
  multi-site refactor to confound the result.

  ## Why this specific task

  A plausible first attempt trips Go's strict compiler: a missing return, a
  declared-and-not-used variable, a wrong type. Each is a NEW diagnostic in the
  same file — precisely the signal that revert-on-new-diagnostics (poly-lsp's
  `--validate`) acts on.

  Validated editing reverts the broken write and hands the error back for an
  in-turn retry. Unvalidated editing leaves the file broken until the model
  happens to re-run the tests, spending turns it may not have. Because the edit
  is a single node, any gap between the validated and unvalidated arms attributes
  cleanly to edit safety rather than to refactoring skill.

  ## Reading a failure

  `go test` is the spine signal and requires the file to both compile and be
  correct; `go build` is asserted separately so "broke the build" is
  distinguishable from "logic wrong" in the report. The workspace is
  git-committed before the run, so the diff check catches passing tests by
  weakening them. Watch `brokenIntermediates` too: it counts edits that left the
  workspace failing `go build` even if a later edit fixed things, which is the
  metric that separates validated from unvalidated editing on runs both
  ultimately pass.
# Isolates ONE failure mode: compile breakage from a single-node edit — exactly
# what revert-on-new-diagnostics (poly-lsp `--validate`) catches. Implementing
# Pop is one node_edit, and a plausible attempt trips Go's strict compiler
# (missing return, declared-and-not-used, wrong type) — a NEW same-file
# diagnostic. Validated node_edit reverts it and hands the error back for an
# in-turn retry; unvalidated leaves the file broken until the model happens to
# re-run the tests, spending a turn budget it may not have. Single node, single
# edit — no multi-site refactor confound, so the polylsp-vs-polylsp-validate
# delta attributes cleanly to edit safety.
workspace: _fixture/
safetyCheck: "go build ./..."
limits: { maxTurnsPerStage: 8, maxToolCallsPerStage: 24 }
stages:
  - prompt: |
      This Go module has one unimplemented method. Implement the `Pop` method on
      `IntStack` in stack/stack.go: it removes and returns the top element with
      ok=true, or returns 0, false when the stack is empty. Change nothing else,
      and make the tests pass.
    checks:
      # Spine signal, toolset-agnostic: passing tests requires the file to
      # COMPILE and be correct. A compile-broken edit fails here — this is the
      # pass-rate the validated arm should lift.
      - cmd_ok: "go test ./..."
      # Assert compilation explicitly so a build break is attributed cleanly in
      # the report (separates "broke the build" from "logic wrong").
      - cmd_ok: "go build ./..."
      # No passing tests by weakening them — the runner git-commits the fixture,
      # so any edit to the test file shows in the diff (exit!=0 fails the check).
      - cmd_ok: "git diff --quiet -- stack/stack_test.go"
