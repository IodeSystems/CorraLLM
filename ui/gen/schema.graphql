type corrallm_RollupRow {
  """Of baselineUsd, the cache-read charge: cached tokens × the baseline's cached rate. Locally these tokens are free (served from the KV cache, no recompute); on a paid API they are billed at a reduced but nonzero rate, so this is a real part of the difference."""
  baselineCachedUsd: Float!
  """Empty when the comparison covers this row. Otherwise why it does not: "audio" (billed per MiB, not per token), "image" (billed per image; the local coefficient is unset on this box, so these already cost $0), "paid" (already on a paid provider), "off-box" (a configured model served elsewhere — its local figure is not a local figure), "unknown-model" (the served model has left the config, so nothing says what priced it), "no-tokens" (no tokens were recorded, and $0 on any rate table is not a measurement)."""
  baselineExcluded: String!
  """Of baselineUsd, the output charge: completionTokens × the baseline's generated rate."""
  baselineGeneratedUsd: Float!
  """Of baselineUsd, the input charge: processed tokens (promptTokens − cachedTokens) × the baseline's processed rate."""
  baselineProcessedUsd: Float!
  """The paid commandCosts type this row's baseline figures were priced at: the served model's costEquivalent when it names a paid type, else the window's default (usageRollup.baselineType). Empty when baselineExcluded is set or no paid type exists. Empty on the total, which can span several."""
  baselineType: String!
  """What this row's tokens would have cost on the baseline paid type (usageRollup.baselineType) — the sum of the three class figures below. 0 when baselineExcluded is set."""
  baselineUsd: Float!
  """How this row's cost was arrived at: "energy" (this fleet's electricity, kWh × costPerKwh), "paid" (a provider's per-token rates), "free" (a remote backend with a declared freeTier and no per-token rates — somebody else's hardware at no charge, so the cost is $0 because that is the price), or "unattributed" (this box's energy coefficients applied to a model corrallm does not run and nothing says what it charges, or to one that has left the config — neither electricity nor a bill, and a config gap to fix by declaring what that backend costs)."""
  billing: String!
  """Per-request cache hit (cached / prompt tokens), 0..1: mean over requests. cacheHitRate is the token-weighted figure."""
  cacheAvg: Float!
  """cachedTokens / promptTokens, 0..1. Only meaningful when cacheReports > 0."""
  cacheHitRate: Float!
  """Requests the per-request cache figures are over: served requests with a prompt, from models that reported any cache hit in the window. 0 means nothing here reports a cache — not a measured 0%."""
  cacheN: Long!
  """Per-request cache hit, 0..1: 90th percentile."""
  cacheP90: Float!
  """Requests that reported any cache hit. ZERO MEANS UNKNOWN, NOT 0% — a backend with no prompt cache (embeddings, most remote providers) never reports, and showing that as a measured miss rate invents a problem."""
  cacheReports: Long!
  """Estimated prompt-processing time avoided: cachedTokens / mean observed prompt tokens-per-second. An estimate — the speed varies with batch and context."""
  cachedSecondsSaved: Float!
  """Prompt tokens the backend served from cache instead of reprocessing."""
  cachedTokens: Long!
  """Total completion tokens."""
  completionTokens: Long!
  """Total cost, USD."""
  costUsd: Float!
  """Per request: mean completion tokens of the answer (completion minus thinking), over ctxThinkingN turns."""
  ctxAnswerAvg: Float!
  """Per request: mean prompt tokens the backend already held (not re-processed)."""
  ctxCachedAvg: Float!
  """Per request: mean prompt tokens (what the caller sent, including history)."""
  ctxPromptAvg: Float!
  """Per request: mean context tokens (prompt + completion) per served chat turn. A long conversation counts once per turn."""
  ctxRequestAvg: Float!
  """Per request: 90th percentile of context tokens per served chat turn."""
  ctxRequestP90: Long!
  """Per request: 99th percentile of context tokens per served chat turn."""
  ctxRequestP99: Long!
  """Served chat turns that named a conversation — what ctxRequestAvg/ctxRequestP90 are over."""
  ctxRequests: Long!
  """Conversations seen in the window — what ctxTailAvg/ctxTailP90 are over. A conversation whose message count drops (restarted or compacted) counts again."""
  ctxSessions: Long!
  """Per session tail: mean context tokens at each conversation's LAST turn in the window. Each turn overwrites the one before, so a conversation counts once."""
  ctxTailAvg: Float!
  """Per session tail: 90th percentile of context tokens at each conversation's last turn."""
  ctxTailP90: Long!
  """Per session tail: 99th percentile of context tokens at each conversation's last turn."""
  ctxTailP99: Long!
  """Per request: mean completion tokens spent thinking (reasoning_content), over ctxThinkingN turns."""
  ctxThinkingAvg: Float!
  """Turns whose thinking was measured — what ctxThinkingAvg/ctxAnswerAvg are over. Fewer than ctxRequests over windows reaching back before 2026-10-07, or for non-llama backends."""
  ctxThinkingN: Long!
  """Total dwell, milliseconds."""
  dwellMs: Long!
  """energyUsd / costPerKwh — the kilowatt-hours behind it. 0 when the rate is unset. Measured when energyMeasured is set."""
  energyKwh: Float!
  """energyKwh is this model's share of its card's MEASURED draw (usageRollup.power), not the per-token estimate; costUsd and energyUsd follow it."""
  energyMeasured: Boolean!
  """The part of costUsd that is electricity: nonzero only when billing is "energy"."""
  energyUsd: Float!
  """Requests served at no charge by a backend with a declared freeTier and no per-token rates. Equals requests when billing is "free", else 0; on the total, how many of the window's requests cost nothing. The gate for showing a free-tier figure: its dollar value is always $0, so the count is the only thing that says whether the $0 was measured."""
  freeRequests: Long!
  """What the store had RECORDED against this row that is charged to no kind here: nonzero only when billing is "free". These rows were metered with this box's watt-hour coefficients for tokens processed elsewhere, so the figure is neither electricity nor a bill and costUsd reports 0 instead. It is surfaced rather than dropped because a total that quietly shrank cannot be checked. Metering itself now bills a declared free tier $0 (cost.NoCharge), so this decays to 0 as the 30-day retention window turns over — a nonzero value means rows recorded before that fix are still in the window."""
  mispricedUsd: Float!
  """The part of costUsd that is a provider's bill: nonzero only when billing is "paid"."""
  paidUsd: Float!
  """Mean backend-reported generation speed, tokens/sec (tg/s). Separates a slowdown caused by more prompt to read (this holds steady) from one caused by the box itself (this falls). Same caveats as promptPerSec."""
  predictedPerSec: Float!
  """Raw prefill split by new tokens per request: <500, 500-2k, 2k-8k, 8k+."""
  prefillBuckets: [corrallm_PrefillBucketRow!]!
  """Prompt tokens INCLUDING the cached prefix, per second of prefill, tokens/sec: the rate a caller's prompt was effectively read at."""
  prefillFusedTps: Float!
  """Requests that reported a prefill rate and processed at least one new token — what the prefill* figures are over."""
  prefillN: Long!
  """New (uncached) prompt tokens per second of prefill, tokens/sec, token-weighted: what the GPU actually processed."""
  prefillRawTps: Float!
  """Mean prefill time per request, seconds (new tokens / reported rate)."""
  prefillSecAvg: Float!
  """Mean backend-reported prompt-processing speed, tokens/sec (tp/s). An unweighted mean over the requests that REPORTED a rate, not a throughput — 0 means nothing reported one, not a measured zero. Always 0 on the grand total, which cannot average rates honestly."""
  promptPerSec: Float!
  """Total prompt tokens."""
  promptTokens: Long!
  """Request count."""
  requests: Long!
  """Served model name."""
  served: String!
  """Sessions with exactly one served turn — callers that did not come back; ctxSessions minus this are repeat."""
  singleTurnSessions: Long!
  """Decode (generation) speed, tokens/sec: mean over requests."""
  tgAvg: Float!
  """Requests that reported a decode speed — what the tg* figures are over."""
  tgN: Long!
  """Decode speed, tokens/sec: 10th percentile — the slow tail."""
  tgP10: Float!
  """Decode speed, tokens/sec: 90th percentile — the fast tail."""
  tgP90: Float!
  """Decode speed, tokens/sec: 99th percentile."""
  tgP99: Float!
  """Prefill (prompt processing) speed, tokens/sec: mean over requests."""
  tpAvg: Float!
  """Requests that reported a prefill speed — what the tp* figures are over."""
  tpN: Long!
  """Prefill speed, tokens/sec: 10th percentile — the slow tail."""
  tpP10: Float!
  """Prefill speed, tokens/sec: 90th percentile — the fast tail."""
  tpP90: Float!
  """Prefill speed, tokens/sec: 99th percentile."""
  tpP99: Float!
  """Served turns per conversation session, mean."""
  turnsAvg: Float!
  """The longest conversation session in the window, in served turns."""
  turnsMax: Long!
  """Served turns per conversation session, 90th percentile."""
  turnsP90: Long!
  """Served turns per conversation session, 99th percentile."""
  turnsP99: Long!
  """The model's cost class — its commandCosts key. Empty when the model is no longer in the config."""
  type: String!
  """The part of costUsd that is neither: nonzero only when billing is "unattributed"."""
  unattributedUsd: Float!
}

