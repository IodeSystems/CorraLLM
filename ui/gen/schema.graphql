type corrallm_UtilizationMember {
  """Slots of this rung in service right now."""
  active: Long!
  """This rung's admission slots; 0 if it has never been admitted to since start."""
  capacity: Long!
  """Served model this rung resolves to."""
  model: String!
  """Why it is paused (operator-supplied)."""
  pauseReason: String!
  """Out of service by operator order: the walk skips it and it will not spawn."""
  paused: Boolean!
  """Served by a host corrallm does not run: nothing to load, always available."""
  remote: Boolean!
  """Requests for the lane this rung answered in the window."""
  routed: Long!
  """A local process backs it — its own cmd, or its hosting extension's."""
  spawnable: Boolean!
  """absent|loading|ready|failed|evicting, or 'stopping' mid-teardown. Empty when remote."""
  state: String!
  """Callers queued on this rung right now."""
  waiting: Long!
}

type corrallm_UtilizationOutputBody {
  """The window the windowed columns cover."""
  minutes: Long!
  """One row per served model seen in the window (or busy right now), busiest first."""
  rows: [corrallm_UtilizationRow!]!
}

type corrallm_UtilizationRow {
  """Slots in use right now."""
  active: Long!
  """The longest queue wait that applies to this model — its own override, or the box-wide one. 0 = unbounded."""
  allowedWaitMs: Long!
  """For a lane, every request that asked for it in the window, answered or not."""
  askedFor: Long!
  """Admission slots across this name's backends; 0 if none has been touched since start."""
  capacity: Long!
  """scheduler.maxQueueDepth as configured (0 = unbounded)."""
  configuredDepth: Long!
  """Configured depth exceeds what maxWait allows — the depth bound is dead config, callers always time out first."""
  depthUnreachable: Boolean!
  """Callers who came back BEFORE the time we gave them (ignoring Retry-After)."""
  early: Long!
  """What we would tell a caller arriving right now to wait — the scheduler's own estimate, live. 0 if no dwell sample yet."""
  estWaitMs: Long!
  """This name is a lane: its live load is the sum of the members below, not separate capacity."""
  lane: Boolean!
  """Longest measured queue wait in the window."""
  maxWaitMs: Long!
  """For a lane, the rungs whose slots it is reporting, in fall-through order."""
  members: [corrallm_UtilizationMember!]!
  """Promises whose due time passed with no return — we told them to come back and they never did."""
  notHonored: Long!
  """Utilization reached or passed 1 over the window: arrivals outpaced service and no finite steady-state wait exists."""
  pkSaturated: Boolean!
  """Queueing-theory expected wait, ρ/(1−ρ)·E[S]·(1+CV²)/2 — what the measured distribution implies, versus what the scheduler estimates. 0 when not computable; see pkSaturated."""
  pkWaitMs: Long!
  """Promises made in the window that are still outstanding (due in the future, not back yet)."""
  promised: Long!
  """How many requests queued at all — realWaitMs over 1 or 2 samples is not a trend."""
  queuedSamples: Long!
  """How deep the queue can get before maxWait times the front waiter out: capacity × maxWait / meanService. 0 if not computable."""
  reachableDepth: Long!
  """Measured mean wait of requests that actually queued and were then admitted, over the window. 0 if nothing queued."""
  realWaitMs: Long!
  """Utilization over the window: total service time / (capacity × window). 0 if capacity is unknown."""
  rho: Float!
  """Served model or lane name."""
  served: String!
  """Coefficient of variation of service time. Above 1 means the mean is tail-dominated and position×mean badly under-estimates a queue."""
  serviceCv: Float!
  """Mean time a request actually occupied a slot (queue and cold-load excluded)."""
  serviceMeanMs: Long!
  """Requests behind the service-time stats."""
  serviceSamples: Long!
  """Total promises made in the window, whatever became of them."""
  turnedAway: Long!
  """The maxWait at which the configured depth becomes reachable: depth × meanService / capacity, rounded up to a whole second. 0 if not computable."""
  waitForDepthMs: Long!
  """Callers queued right now."""
  waiting: Long!
}

