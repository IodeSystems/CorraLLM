  elapsedMs: Long!
  """Priority group (lane) the caller resolved to."""
  group: String!
  """Process-local id (not the activity row id)."""
  id: Long!
  """Caller key (empty = unkeyed/default lane)."""
  key: String!
  """Request path."""
  path: String!
  """Caller volunteered this request for preemption (X-Corrallm-Retryable). A request may only widen its interruptibility, never narrow it."""
  retryable: Boolean!
  """Requested model/lane name."""
  served: String!
  """Client IP."""
  sourceIp: String!
  """RFC3339 arrival time."""
  startedAt: String!
  """queued (awaiting a slot) | loading (awaiting backend) | streaming (proxying)."""
  state: String!
  """Client asked for a streamed response."""
  streaming: Boolean!
}

